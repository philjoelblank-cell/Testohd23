name: probe
on:
  push:
    branches: ['probe/**']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            .gradle/loom-cache
          key: probe12111-v1
      - run: chmod +x gradlew && ./gradlew genSources --no-configuration-cache -q || true
      - run: |
          f=$(find . ~/.gradle -name "*sources.jar" | grep minecraft-merged | grep "1.21.11" | head -1)
          mkdir s && cd s && unzip -q "../$f" 2>/dev/null || unzip -q "$f"
          bash ../.github/probe.sh
