# Starts the game on a virtual screen, clicks through the menus and a test world and saves screenshots.
name: screenshots
on:
  workflow_dispatch:
  push:
    branches: ["test/**"]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: virtual screen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri ffmpeg > /dev/null
      - run: chmod +x ./gradlew
      - name: run the game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          mkdir -p run/screenshots
          # video: the test writes video.start / video.stop, ffmpeg films the virtual screen in between
          ( while [ ! -f run/screenshots/video.start ]; do sleep 1; done
            ffmpeg -y -loglevel warning -f x11grab -framerate 20 -video_size 1920x1080 -i :99 -vf scale=1280:-2 \
              -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p /tmp/v1_video.mp4 &
            FF=$!
            while [ ! -f run/screenshots/video.stop ]; do sleep 1; done
            kill -INT $FF; wait $FF ) &
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 3
          DISPLAY=:99 timeout 35m ./gradlew runClient --no-configuration-cache -Ptestohd_autotest || true
          sleep 8
          rm -f run/screenshots/video.start run/screenshots/video.stop
          cp /tmp/v1_video.mp4 run/screenshots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            run/screenshots/
            run/logs/latest.log
            run/crash-reports/
      - name: publish screenshots to the ci-screens branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r run/screenshots/* /tmp/shots/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q -b ci-screens && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens
