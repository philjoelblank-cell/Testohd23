# Starts the game on a virtual screen, clicks through the menus and a test world and saves screenshots.
name: screenshots
on:
  workflow_dispatch:
  push:
    branches: ["test/**"]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: virtual screen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - run: chmod +x ./gradlew
      - name: run the game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: timeout 35m xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient --no-configuration-cache -Ptestohd_autotest || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            run/screenshots/
            run/logs/latest.log
            run/crash-reports/
      - name: publish screenshots to the ci-screens branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r run/screenshots/* /tmp/shots/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q -b ci-screens && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens
