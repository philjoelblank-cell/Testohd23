# Builds the mod on every push. Pushing a tag like v1.0.1 also publishes a GitHub release
# with the jar – the in-game updater of every player picks that up automatically.
name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build --no-configuration-cache -Pversion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build --no-configuration-cache
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: testohd-styles
          path: build/libs/
      - name: remove sources jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: rm -f build/libs/*-sources.jar
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Testohd Styles ${{ github.ref_name }}
          files: build/libs/testohd-styles-*.jar
          body: |
            Testohd Styles – Made by Testohd23
            Lege die .jar in deinen mods-Ordner (Minecraft 1.21.11, Fabric + Fabric API).
            Danach updatet sich die Mod von selbst.
