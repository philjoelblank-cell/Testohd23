# Builds the mod on every push. Pushing a tag like v1.0.1 also publishes a GitHub release
# with the jar – the in-game updater of every player picks that up automatically.
name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build --no-configuration-cache -Pversion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build --no-configuration-cache
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: testohd-styles
          path: build/libs/
      - name: remove sources jar
        run: rm -f build/libs/*-sources.jar
      - name: release new 26.3 versions automatically (pre-release, so 1.21.11 players never get this jar)
        if: github.ref == 'refs/heads/mc-26.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          if ! gh release view "v$VER-mc26.3" > /dev/null 2>&1; then
            gh release create "v$VER-mc26.3" build/libs/testohd-styles-*.jar --prerelease --target mc-26.3 --title "Testohd Styles v$VER für Minecraft 26.3" \
              --notes "Testohd Styles – Made by Testohd23. Für Minecraft 26.3 (Fabric + Fabric API). Lege die .jar in deinen mods-Ordner. Danach updatet sich die Mod von selbst."
          fi
      - name: release new versions from main automatically
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          if ! gh release view "v$VER" > /dev/null 2>&1; then
            gh release create "v$VER" build/libs/testohd-styles-*.jar --title "Testohd Styles v$VER" \
              --notes "Testohd Styles – Made by Testohd23. Lege die .jar in deinen mods-Ordner (Minecraft 1.21.11, Fabric + Fabric API). Danach updatet sich die Mod von selbst."
          fi
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Testohd Styles ${{ github.ref_name }}
          files: build/libs/testohd-styles-*.jar
          body: |
            Testohd Styles – Made by Testohd23
            Lege die .jar in deinen mods-Ordner (Minecraft 1.21.11, Fabric + Fabric API).
            Danach updatet sich die Mod von selbst.
